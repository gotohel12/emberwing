# ARVEX SURVIVAL — game + API + multiplayer servers + launcher distribution
# For persistent worlds/playtime attach a Render Disk and set DATA_DIR to its mount path (free plan disks are wiped on deploy).
services:
  - type: web
    name: emberwing
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
