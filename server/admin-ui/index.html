<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ARVEX Admin</title>
<link rel="icon" href="/brand/arvex-mark.svg">
<link rel="stylesheet" href="/arvex.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div id="gate" class="gate" hidden></div>
<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand"><img src="/brand/arvex-logo-dark.svg" alt="ARVEX"><span class="ax-meta">ADMIN</span></div>
    <nav id="nav" class="nav" aria-label="Sections"></nav>
    <div class="side-foot"><span class="ax-meta" id="ver"></span></div>
  </aside>
  <header class="top">
    <button class="ax-btn ghost sm menu" id="menu" aria-label="Menu">☰</button>
    <div class="search"><input class="ax-input" id="q" type="search" placeholder="Search players, reports, tickets, releases, logs…" autocomplete="off" aria-label="Global search"><div id="q-res" class="q-res" hidden></div></div>
    <div class="live" id="live"></div>
    <div class="who"><div><b id="who-name"></b><span class="ax-meta" id="who-role"></span></div><button class="ax-btn ghost sm" id="logout">Sign out</button></div>
  </header>
  <main id="main" class="main" tabindex="-1"></main>
</div>
<div id="modals"></div>
<div id="toasts" class="ax-toasts" role="status" aria-live="polite"></div>
<script src="/admin/admin.js"></script>
</body>
</html>
